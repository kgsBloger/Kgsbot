name: Auto Post to Blogger via Email

on:
  schedule:
    - cron: '0 8 * * *' # हर दिन भारतीय समयानुसार दोपहर 1:30 बजे (8:00 AM UTC) ऑटोमैटिक चलेगा
  workflow_dispatch: # इससे आप GitHub Actions में खुद जाकर बटन दबाकर तुरंत टेस्ट भी कर सकते हैं

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-generativeai

      - name: Run Script to Publish Post
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: |
          python main.py
