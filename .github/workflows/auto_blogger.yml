name: Daily Auto Luxury Blogger

on:
  schedule:
    - cron: '0 6 * * *' # हर दिन सुबह 6:00 UTC (भारतीय समयानुसार 11:30 AM) पर चलेगा
  workflow_dispatch: # मैन्युअल रूप से चलाने का बटन

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests google-api-python-client google-auth-oauthlib google-auth

      - name: Run Script
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python main.py
          
