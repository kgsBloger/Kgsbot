name: Daily Luxury Blogger Post

on:
  schedule:
    # 00:30 UTC = 06:00 AM Indian Standard Time (IST)
    - cron: '30 0 * * *'
  workflow_dispatch: # इससे आप GitHub पर 'Run Workflow' बटन दबाकर कभी भी टेस्ट कर सकते हैं

jobs:
  publish-post:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-generativeai

      - name: Run script and publish blog
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: python main.py
